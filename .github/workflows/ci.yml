# Plan §11: catalog YAML is schema-checked in CI; §14: lockfile + CI checks on every change.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_superuser_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PSQL_SUPERUSER_URL: postgres://postgres:ci_superuser_only@localhost:5432/postgres
      CAFAI_DEV_DB_PASSWORD: ci_only
      # The browser checks below serve the app the way production runs today: fixture catalog, no AI key (mock model).
      DATABASE_OWNER_URL: postgres://cafai_owner:ci_only@localhost:5432/cafai_dev
      DATABASE_CATALOG_URL: postgres://cafai_catalog:ci_only@localhost:5432/cafai_dev
      DATABASE_URL: postgres://cafai_app:ci_only@localhost:5432/cafai_dev
      CAFAI_CATALOG: fixture
      QUOTA_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/db-bootstrap.sh
      - run: npm run typecheck
      - run: npm run catalog:check
      - run: npm run cases:check
      - run: npm test
      - run: npm run eval
      - run: npm run build
      # Browser checks (plan §18) on every change, free: the mock model makes no paid calls.
      - name: Prepare the app database
        # Both snapshots: the intake's example buttons answer from the real catalog (catalog/examples).
        run: npm run db:migrate && npx tsx scripts/publish-catalog.ts --fixtures && npx tsx scripts/publish-catalog.ts
      - name: Start the app
        # The browser checks make about 15 runs from one address, above the default hourly cap of 10.
        env:
          CAFAI_RUNS_PER_HOUR: "50"
        run: |
          npx next start -p 3100 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3100/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/next.log"; exit 1
      - name: Browser flow (85 checks)
        run: CHROMIUM_PATH=$(command -v google-chrome) npm run flow -- http://localhost:3100 "$RUNNER_TEMP/screens"
      - name: Accessibility (6 checks)
        run: CHROMIUM_PATH=$(command -v google-chrome) npm run a11y -- http://localhost:3100
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
