# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: claude-for-google-sheets
kind: plugin
identity:
  display_name: Get Claude's help right inside your Google Sheet
  vendor: Anthropic, the maker of Claude
  vendor_short: Anthropic
  technical_name: Claude for Google Workspace (Google Workspace Marketplace add-on for Docs, Sheets and Slides)
capabilities:
- in-sheet-help
need_signals:
- text: Builds a summary, formulas or a report by hand in Google Sheets
  need_type: implied
skip_if:
- Your work or school Google account blocks add-ons and won't allow this one.
- You'd rather have Claude Desktop do the whole report for you.
resource_profile:
  provides:
  - text: Adds a Claude panel to Google Docs, Sheets and Slides. It reads the file you have open and edits it right there. Every change is kept in the file's version history.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  - text: In Sheets it can build spreadsheets that do the math, write and fix formulas, and tidy up messy data.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  requires:
  - text: A paid Claude plan (Pro, Max, Team or Enterprise). Your Google account must be allowed to add apps from Google's add-on store, the Google Workspace Marketplace.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  supports:
  - text: One install covers Docs, Sheets and Slides, and the sidebar can use the connectors already set up in Claude.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  limits:
  - text: It is still in testing.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  - text: Your work or school may block add-ons on your Google account. If so, only the person who runs its Google accounts can allow this one or add it for you.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
distributions:
- client: any
  method: manual_steps
  steps:
  - Open the "Official guide" link below. On that page, follow the link to the Google Workspace Marketplace (Google's add-on store). Click Install there, and pick the Google account you use for Sheets.
  - Reload your sheet. Go to Extensions > Claude > Open Claude. Say yes to the two permissions Google asks for, then sign in with your Claude account.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
access:
  auth: oauth
  credential_needed: your Claude account, and a yes to two Google permission requests
  read_write: read_write
  data_touched:
  - The Google Docs, Sheets or Slides file you have open
  access_plain: Can see and change the file you have open, when you ask it to. Every change shows in the file's version history.
  access_short: Your open file. Can also use your Claude add-ons. Changes the file when asked.
  effort_plain: About 2 minutes. Needs a paid Claude plan.
  effort_short: About 2 min
  first_step: Have a paid Claude plan. Your Google account must allow add-ons.
  least_privilege_steps:
  - First select the cells you want it to work on. That tells it where to work. It can still see the rest of the file.
  - After its first change, open your sheet's version history. That's where you can undo a change.
runtime:
  location: remote
cost:
