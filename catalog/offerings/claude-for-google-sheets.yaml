# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: claude-for-google-sheets
kind: plugin
identity:
  display_name: Claude in a sidebar inside Google Sheets
  vendor: Anthropic
  technical_name: Claude for Google Workspace (Google Workspace Marketplace add-on for Docs, Sheets and Slides)
capabilities:
- in-sheet-help
need_signals:
- text: Builds a summary, formulas or a report by hand in Google Sheets
  need_type: implied
skip_if:
- Your Google admin blocks Marketplace add-ons and won't allow this one.
- You'd rather have Claude Desktop do the whole report through connectors.
resource_profile:
  provides:
  - text: Adds a Claude sidebar to Google Docs, Sheets and Slides that reads the open file and edits it in place, with every change in version history.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  - text: In Sheets it can build spreadsheet models, write and fix formulas, and clean up data.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  requires:
  - text: A Pro, Max, Team or Enterprise plan, and a Google account that is allowed to install Google Workspace Marketplace apps.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  supports:
  - text: One install covers Docs, Sheets and Slides, and the sidebar can use the connectors already set up in Claude.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  limits:
  - text: It is in beta.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
  - text: If your organization blocks Marketplace apps, only a Google Workspace admin can allow or install it.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
    as_of: 2026-10-06
distributions:
- client: any
  method: manual_steps
  steps:
  - Open Claude's listing in the Google Workspace Marketplace (linked from Anthropic's help page), click Install and choose the Google account you use for Sheets.
  - Reload your sheet, then go to Extensions > Claude > Open Claude, allow the two permissions Google asks for, and sign in with your Claude account.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
access:
  auth: oauth
  credential_needed: Allow two Google permissions, then sign in with your Claude account
  read_write: read_write
  data_touched:
  - The Google Docs, Sheets or Slides file you have open
  access_plain: Reads and edits the file you have open when you ask it to. Every change shows in the file's version history.
  effort_plain: About 2 minutes if your Google account can install Marketplace apps
  least_privilege_steps:
  - Select the cells you want it to work on first, so it stays in that range.
  - Check the version history after its first edit, so you know how to undo one.
runtime:
  location: remote
cost:
  model: paid
  plan_required: Claude Pro, Max, Team or Enterprise (beta)
  source_url: https://support.claude.com/en/articles/16951679-use-claude-in-google-docs-sheets-and-slides
  as_of: 2026-10-06
