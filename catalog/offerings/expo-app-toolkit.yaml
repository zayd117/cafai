  first_prompt: Use Expo's how-to guides to start a new calorie and macro tracker app. Give it three tabs called Today, Add food and Progress. Then tell me step by step, in plain words, how to open it on my phone.
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
