# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: expo-app-toolkit
kind: plugin
identity:
  display_name: Make your iPhone and Android app with Expo
  vendor: Expo
  technical_name: Expo plugin for Claude Code (Expo agent skills plus the hosted Expo MCP server)
  registry_namespace: expo@claude-plugins-official
  package_id: expo-mcp
  repo_url: https://github.com/expo/skills
capabilities:
- mobile-app-build
need_signals:
- text: Building an app for iPhone and Android without native coding experience
  need_type: implied
skip_if:
- Your app was started without Expo or React Native, or is iPhone-only or Android-only.
- You are making a website, not a phone app.
resource_profile:
  provides:
  - text: Expo's own how-to guides teach your AI to start, fix and release an Expo app. They also show how to move it to a newer Expo version. They cover screens, moving between them, how the app looks, animations and loading data.
    evidence: claimed
    source_url: https://github.com/expo/skills/blob/main/plugins/expo/README.md
    as_of: 2026-10-06
  - text: The add-on also links Claude Code to your Expo account online.
    evidence: observed
    source_url: https://github.com/expo/skills/blob/main/plugins/expo/.mcp.json
    as_of: 2026-10-06
  - text: On a paid Expo plan, the link to your Expo account lets your AI search Expo's latest help pages. It can add ready-made parts that work with your app, and make and check new versions of it online. It can run Expo tasks you saved, and send your app to the stores. It can read crash reports from TestFlight (Apple's test app) and Google Play. It can also read your App Store and Google Play reviews.
    evidence: claimed
    source_url: https://docs.expo.dev/eas/ai/mcp/
    as_of: 2026-10-06
  - text: While you test your app from your computer, your AI can take screenshots of it and tap around in it. It can also collect your app's error messages.
    evidence: claimed
    source_url: https://docs.expo.dev/eas/ai/mcp/
    as_of: 2026-10-06
  requires:
  - text: An Expo account, and an app made with the latest version of Expo.
    evidence: claimed
    source_url: https://docs.expo.dev/eas/ai/mcp/
    as_of: 2026-10-06
  - text: Screenshots and tapping need Expo version 54 or later. They also need one extra piece added to your app (expo-mcp). And the app must be started in a special way (with EXPO_UNSTABLE_MCP_SERVER=1).
    evidence: claimed
    source_url: https://docs.expo.dev/eas/ai/mcp/
    as_of: 2026-10-06
  - text: To put your app in Apple's App Store, you need an Apple Developer Program membership. It costs 99 USD per membership year.
    evidence: claimed
    source_url: https://developer.apple.com/support/compare-memberships/
    as_of: 2026-10-06
  - text: To put your app on Google Play, you need a Google Play developer account. It costs US$25 once, when you sign up.
    evidence: claimed
    source_url: https://support.google.com/googleplay/android-developer/answer/6112435
    as_of: 2026-10-06
  supports:
  - text: Claude web, desktop and mobile can add the same hosted server from the Claude connectors directory, where Anthropic lists it as made by Expo.
    evidence: claimed
    source_url: https://claude.com/connectors/expo
    as_of: 2026-10-06
  - text: For Cursor, Expo documents installing the same skills with the skills command-line tool (npx skills add expo/skills).
    evidence: claimed
    source_url: https://docs.expo.dev/skills/
    as_of: 2026-10-06
  - text: Expo Go lets you open the project on a real phone by scanning a QR code; Expo calls it a playground that is not meant for production apps, which use a development build instead.
    evidence: claimed
    source_url: https://docs.expo.dev/get-started/set-up-your-environment/
    as_of: 2026-10-06
  limits:
  - text: Your AI can connect to only one running copy of your app at a time. On iPhone, screenshots and tapping work only in Apple's pretend iPhone on a Mac (the iOS simulator).
    evidence: claimed
    source_url: https://docs.expo.dev/eas/ai/mcp/
    as_of: 2026-10-06
  - text: Searching Expo's help pages needs a paid Expo plan.
    evidence: claimed
    source_url: https://docs.expo.dev/eas/ai/mcp/
    as_of: 2026-10-06
  - text: On the free plan, Expo's pricing page says the link to your Expo account is limited to fair use.
    evidence: claimed
    source_url: https://expo.dev/pricing
    as_of: 2026-10-06
  - text: Some guides use paid Expo services, beyond what the free plan allows. They cover sending to the app stores, and sending updates straight to phones. They also cover putting parts of your app online, and testing on pretend phones that run online.
    evidence: claimed
    source_url: https://github.com/expo/skills/blob/main/README.md
    as_of: 2026-10-06
  - text: In Cursor and Claude Desktop, you only get the link to your Expo account. Expo's how-to guides are added separately there.
    evidence: inferred
    source_url: https://docs.expo.dev/skills/
    as_of: 2026-10-06
distributions:
- client: claude_code
  method: plugin_marketplace
  command: claude plugin install expo@claude-plugins-official
  steps:
  - Claude Code can run the command above for you. Or type /plugin install expo@claude-plugins-official into Claude Code yourself. Then it asks where to install it.
  - Then type /mcp in Claude Code. It lists your add-ons and lets you sign in. Sign in to Expo when asked.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://docs.expo.dev/skills/
- client: claude_code
  method: cli_command
  command: claude mcp add --transport http expo https://mcp.expo.dev/mcp
  steps:
  - Use this only if you want the link to your Expo account without Expo's how-to guides. Then type /mcp in Claude Code to sign in.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://docs.expo.dev/eas/ai/mcp/
- client: cursor
  method: deeplink
  link: cursor://anysphere.cursor-deeplink/mcp/install?name=expo&config=eyJ1cmwiOiJodHRwczovL21jcC5leHBvLmRldi9tY3AifQ%3D%3D
  steps:
  - This link only adds Expo's address, https://mcp.expo.dev/mcp, taken from Expo's own setup file. Cursor then asks you to sign in to Expo.
  compatibility: derived
  verified_on: 2026-10-06
  source_url: https://github.com/expo/skills/blob/main/plugins/expo/.mcp.json
- client: claude_desktop
  method: connector
  url: https://claude.ai/directory/expo
  steps:
  - Open the "Start here" link above. It's Expo's page in Claude's list of add-ons. Add it, then sign in to Expo.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://docs.expo.dev/eas/ai/mcp/
access:
  auth: oauth
  credential_needed: a free Expo account. You sign in to it in your web browser, with no key to copy
  read_write: read_write
  data_touched:
  - Expo projects, cloud builds and workflows
  - TestFlight and Google Play crash reports and tester feedback
  - App Store and Google Play reviews
  - The running app on your simulator or phone (local features only)
  access_plain: Can see your Expo apps, app versions, crash reports and store reviews. If you say yes, it can also make new versions, send your app to the stores and reply to reviews in public.
  access_short: Your apps, crash reports and reviews. Can build, publish and reply if you agree.
  effort_plain: About 10 minutes. Needs a free Expo account.
  effort_short: About 10 min
  first_step: Make a free Expo account.
  least_privilege_steps:
  - In Claude Code, add it for this app only. Repo means your app's folder. If you type /plugin install yourself, pick "Install for you, in this repo only" when asked. If Claude Code runs the command, ask it to install for this repo only.
  - Leave your AI asking you before it acts. If it asks to use build_submit (send to the stores), say no unless you asked for exactly that. Do the same for appstore_reply_review and playstore_reply_review (public replies to reviews).
  - While testing, ask only for test versions (Expo calls them "development" or "internal" builds). Send the app to the stores only when you are ready to launch.
  - Your AI can take screenshots and tap around your app only if it starts the app with EXPO_UNSTABLE_MCP_SERVER=1. Say yes to that only while testing.
runtime:
  location: remote
  requires:
  - Expo account
  - "Local features: an Expo SDK 54+ dev server running on your computer"
cost:
  model: free
  label: Free plan
  plan_required: Free plan ($0) lists 15 Android and 15 iOS builds; Starter from $19/month; the documentation search tool needs a paid EAS plan.
  source_url: https://expo.dev/pricing
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
  namespace_verified: true
  notes: Plugin is listed in Anthropic's official marketplace (claude-plugins-official) and pulled from github.com/expo/skills at a pinned commit, author Expo Team. The npm package expo-mcp is maintained by Expo's accounts (expoadmin). Anthropic's connector directory lists the server as made by Expo. Reviewed by Claude (AI) on 2026-10-06 from the maker's own pages, for the intake's saved examples; no person has reviewed it yet.
