# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: shopify-connector
kind: mcp_server
identity:
  display_name: Let Claude read your Shopify orders and sales
  vendor: Shopify
  technical_name: Shopify connector for Claude (remote server https://setup.shopify.com/mcp)
capabilities:
- store-orders-data
need_signals:
- text: Runs a Shopify store and pulls orders or sales numbers out by hand
  need_type: implied
skip_if:
- Your store is not on Shopify.
- Shopify's own reports already give you the summary you need.
resource_profile:
  provides:
  - text: Reads your orders, with the items bought, whether they have shipped, and shipping details. It also reads customers, products, stock levels and store stats.
    evidence: claimed
    source_url: https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude
    as_of: 2026-10-06
  - text: It can do 25 different things, such as list your orders, open one order or look up store stats.
    evidence: observed
    source_url: https://claude.com/marketplace/connectors/shopify
    as_of: 2026-10-06
  requires:
  - text: A Shopify store and a Claude account. Shopify says to set it up in a web browser on a computer.
    evidence: claimed
    source_url: https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude
    as_of: 2026-10-06
  - text: You approve what it can see and change, in your Shopify admin. It can't do anything your own Shopify account can't do.
    evidence: claimed
    source_url: https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude
    as_of: 2026-10-06
  supports:
  - text: Anthropic's connector directory lists it as made by Shopify and Anthropic verified, added April 2026.
    evidence: observed
    source_url: https://claude.com/marketplace/connectors/shopify
    as_of: 2026-10-06
  limits:
  - text: It can't change your live store design, refund or cancel orders, or change gift cards. It can't touch payment, tax or web address settings.
    evidence: claimed
    source_url: https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude
    as_of: 2026-10-06
  - text: It can change products, stock, collections and discount codes. If you ask for many changes at once, it makes them one item at a time.
    evidence: claimed
    source_url: https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude
    as_of: 2026-10-06
distributions:
- client: claude_desktop
  method: connector
  url: https://claude.com/marketplace/connectors/shopify
  steps:
  - Open the "Start here" link above. Do this on a computer, in your web browser. It's Shopify's page in Claude's list of add-ons. Choose Add to Claude there, not in the Shopify App Store.
  - Claude sends you to your Shopify admin. Check what it asks to see and change, then approve it.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude
access:
  auth: oauth
  credential_needed: your Shopify account, to approve access in your Shopify admin
  read_write: read_write
  data_touched:
  - Orders and order details
  - Customer records (name, email, location, order count, spending)
  - Products, collections and inventory
  - Store analytics
  access_plain: Can see your orders, customers and sales numbers. Can also change products, stock and discount codes, so ask it for reports only.
  effort_plain: About 5 minutes. Shopify says to do it in a web browser on a computer.
  least_privilege_steps:
  - Do you have a staff account that can see orders and reports, but not change store settings? Use that account when you approve it in Shopify.
  - Ask for totals and order numbers, not full customer lists. That keeps customer names and emails out of your chats.
  - Add "Don't change anything in the store" to every report request.
runtime:
  location: remote
cost:
  model: free
  plan_required: Your usual Shopify plan; Shopify charges nothing extra for the connector
  source_url: https://help.shopify.com/en/manual/ai-powered-tools/connecting-ai-tools/shopify-connector-for-claude
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
  namespace_verified: true
  notes: Made by Shopify and marked Anthropic verified in Anthropic's connector directory; Shopify's own help center documents it. mcp.market lists only third-party Shopify servers, none from Shopify, so no grade is recorded. Reviewed by Claude (AI) on 2026-10-06 from the maker's own pages, for the intake's saved examples; no person has reviewed it yet.
editorial:
  what_it_is: An add-on that links Claude to your Shopify store. You approve, in Shopify, what Claude can see and change.
  could_help_with: Getting last week's orders, total sales and average order value whenever you ask.
  first_prompt: Look at my Shopify store. List last week's orders, Monday to Sunday, with order number, date, total and items. Then give me total sales, order count and average order value. Don't change anything in the store.
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
last_verified_on: 2026-10-06
