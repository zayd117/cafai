# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: supabase-backend
kind: plugin
identity:
  display_name: Save each user's account and food log online
  vendor: Supabase
  technical_name: Supabase plugin for Claude Code (Supabase MCP server plus Supabase agent skills)
  registry_namespace: com.supabase/mcp
  package_id: "@supabase/mcp-server-supabase"
  repo_url: https://github.com/supabase/mcp
capabilities:
- app-data-storage
need_signals:
- text: The app has sign-in or keeps each person's food log and goals
  need_type: implied
skip_if:
- Your app keeps everything on the phone, with no sign-in and no second device.
- You already chose another place to keep your app's data online, such as Firebase.
resource_profile:
  provides:
  - text: Your AI can see how your app's data is set up, and change it. It can read and change the data itself. It can get Supabase's advice on security and speed, and read your app's error messages. It can also put small bits of code online.
    evidence: claimed
    source_url: https://supabase.com/docs/guides/getting-started/mcp
    as_of: 2026-10-06
  - text: The add-on links your AI to your Supabase account and adds two how-to guides. One covers sign-in, storing data and files, small bits of code online and live updates. The other covers laying out your data and keeping each person's data private (row-level security).
    evidence: claimed
    source_url: https://supabase.com/docs/guides/ai-tools/plugins
    as_of: 2026-10-06
  - text: The add-on links Claude Code to your Supabase account online.
    evidence: observed
    source_url: https://github.com/supabase-community/supabase-plugin/blob/main/agents/claude/.mcp.json
    as_of: 2026-10-06
  requires:
  - text: A Supabase account and project. At setup, a sign-in page opens in your web browser. There, pick the organization (Supabase's folder for your projects) that holds your project.
    evidence: claimed
    source_url: https://supabase.com/docs/guides/getting-started/mcp
    as_of: 2026-10-06
  supports:
  - text: Supabase has an official Expo React Native tutorial covering sign-in with Supabase Auth, profile data in the database with row-level security, and photo upload with Storage.
    evidence: claimed
    source_url: https://supabase.com/docs/guides/getting-started/tutorials/with-expo-react-native
    as_of: 2026-10-06
  - text: "Server address options: read_only=true runs all queries as a read-only Postgres user, project_ref=<id> limits it to one project and turns off account tools, features=<groups> enables only chosen tool groups."
    evidence: claimed
    source_url: https://supabase.com/docs/guides/getting-started/mcp
    as_of: 2026-10-06
  - text: Anthropic's connector directory lists Supabase, made by Supabase, for Claude web, desktop, mobile and Claude Code.
    evidence: claimed
    source_url: https://claude.com/connectors/supabase
    as_of: 2026-10-06
  limits:
  - text: Supabase warns that linking an AI to your projects has risks. Text hidden in your saved data could trick the AI (prompt injection). The link has your own permissions, as the app's maker. So only you should use it, never your app's users.
    evidence: claimed
    source_url: https://supabase.com/docs/guides/getting-started/mcp
    as_of: 2026-10-06
  - text: The free plan allows 2 active projects, 500 MB of data storage and 50,000 active users a month. Free projects are paused after 1 week without use.
    evidence: claimed
    source_url: https://supabase.com/pricing
    as_of: 2026-10-06
  - text: Supabase's built-in test copies of a project (called branching) need a paid plan. A separate free test project does not.
    evidence: claimed
    source_url: https://supabase.com/docs/guides/getting-started/mcp
    as_of: 2026-10-06
  - text: Every table your app can reach (a list of your app's data, like food logs) needs row-level security turned on. Without it, anyone allowed into a table can read and change all of it.
    evidence: claimed
    source_url: https://supabase.com/docs/guides/database/postgres/row-level-security
    as_of: 2026-10-06
distributions:
- client: claude_code
  method: plugin_marketplace
  command: claude plugin install supabase@claude-plugins-official
  steps:
  - "Claude Code runs the command above. If it says it can't find the add-on store (the marketplace), it first runs this, then tries again: claude plugin marketplace add anthropics/claude-plugins-official"
  - Make a free Supabase test project, if you don't have one yet. Then type /reload-plugins in Claude Code to load the add-on. Then type /mcp and sign in to Supabase. When asked, pick the organization (Supabase's folder for your projects) that holds your test project.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://supabase.com/docs/guides/ai-tools/plugins
- client: claude_code
  method: cli_command
  command: claude mcp add --scope project --transport http supabase "https://mcp.supabase.com/mcp?features=docs%2Caccount%2Cdatabase%2Cdebugging%2Cdevelopment%2Cfunctions%2Cbranching"
  steps:
  - Use this only if you want the link to your Supabase account without Supabase's how-to guides. Then type claude /mcp in the window where you start Claude Code (the terminal). Pick Supabase, and sign in.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://supabase.com/docs/guides/getting-started/mcp
- client: cursor
  method: deeplink
  link: cursor://anysphere.cursor-deeplink/mcp/install?name=supabase&config=eyJ1cmwiOiJodHRwczovL21jcC5zdXBhYmFzZS5jb20vbWNwIn0%3D
  steps:
  - This link only adds Supabase's address, https://mcp.supabase.com/mcp, taken from Supabase's own instructions. Cursor then asks you to sign in to Supabase.
  compatibility: derived
  verified_on: 2026-10-06
  source_url: https://github.com/supabase/mcp
- client: claude_desktop
  method: connector
  url: https://claude.com/connectors/supabase
  steps:
  - Make a free Supabase test project first, if you don't have one. Then open the "Start here" link above. It's Supabase's page in Claude's list of add-ons. Add it, then sign in to Supabase. When asked, pick the organization (Supabase's folder for your projects) that holds your test project.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://claude.com/connectors/supabase
access:
  auth: oauth
  credential_needed: a free Supabase account. You sign in to it in your web browser, with no key to copy
  read_write: read_write
  data_touched:
  - Database tables and their rows
  - Schema migrations
  - Edge Functions and project logs
  - Project URL and publishable keys
  access_plain: Can see and change your app's data in the Supabase project you pick. Can also change the small bits of code your app runs there. You can limit it to looking only.
  access_short: Your Supabase data and code. Can change both unless you make it look-only.
  effort_plain: About 15 minutes. Needs a free Supabase account.
  effort_short: About 15 min
  first_step: Make a free Supabase account and a test project.
  least_privilege_steps:
  - Make a separate free test project for working with your AI, and keep real users' logs in the other one. The free plan allows two active projects.
  - Let your AI reach only that test project. Ask it to add project_ref=<your-project-id> to the Supabase address it uses. Or copy the ready-made address from the MCP tab in Supabase's Connect window, and paste it to your AI.
  - Ever need your AI to look at your real project, with real users' logs? First ask it to add read_only=true to the Supabase address it uses. Then it can look at your data but not change it.
  - Leave your AI asking you before it acts. Two of its requests, execute_sql and apply_migration, can change your data or how it is laid out. Before you allow either one, ask your AI to explain it in plain words.
  - Make sure each person can see only their own food log. Ask your AI to turn on row-level security for every table, with rules that keep each log private.
