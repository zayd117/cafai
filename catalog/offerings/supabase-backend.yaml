  first_prompt: In my Supabase test project, plan where to keep each user's daily food log and saved foods. Include their calorie and macro goals. Use row-level security so each user sees only their own data. Explain the change in plain words, and show it to me before you make it.
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
