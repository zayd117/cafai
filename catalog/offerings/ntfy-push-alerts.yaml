# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: ntfy-push-alerts
kind: api
identity:
  display_name: Get an alert on your phone when your script spots a change
  vendor: ntfy
  technical_name: ntfy.sh publish API
  repo_url: https://github.com/binwiederhier/ntfy
capabilities:
- phone-alerts
need_signals:
- text: wants to be notified by a script, a watcher or a scheduled job
  need_type: implied
- text: notification should reach a phone or another device, not only the computer running the script
  need_type: latent
skip_if:
- A pop-up on the same computer is enough. Tampermonkey can already show one by itself.
- Your employer doesn't allow work data in outside services, and your alerts would need what's in the sheet.
resource_profile:
  provides:
  - text: Turns a short message from any script into an alert on your phone or computer.
    evidence: claimed
    source_url: https://docs.ntfy.sh/
    as_of: 2026-10-06
  - text: Phone apps for Android (Google Play, F-Droid) and iPhone (App Store) show your alerts. You subscribe to your alert name in the app. Anyone can look at how the apps are made.
    evidence: claimed
    source_url: https://github.com/binwiederhier/ntfy/blob/main/README.md
    as_of: 2026-10-06
  - text: ntfy's help pages include sample code for sending an alert from a web page.
    evidence: observed
    source_url: https://docs.ntfy.sh/
    as_of: 2026-10-06
  requires:
  - text: No sign-up for the free service. Your alert name works like a password, so make it hard to guess.
    evidence: claimed
    source_url: https://docs.ntfy.sh/publish/#picking-a-topic
    as_of: 2026-10-06
  supports:
  - text: Access tokens (Bearer auth) for topics protected by access control.
    evidence: claimed
    source_url: https://docs.ntfy.sh/publish/#access-tokens
    as_of: 2026-10-06
  - text: Paid ntfy.sh plans include reserved topics (3 on Supporter, 10 on Pro, 50 on Business).
    evidence: claimed
    source_url: https://ntfy.sh/#pricing
    as_of: 2026-10-06
  - text: The server is open source (Apache 2.0 and GPLv2) and can be self-hosted.
    evidence: claimed
    source_url: https://docs.ntfy.sh/faq/
    as_of: 2026-10-06
  limits:
  - text: On the free service, alert names are public. Anyone who knows or guesses yours can read your alerts. Locking one needs a paid plan, or running ntfy on a computer of your own.
    evidence: claimed
    source_url: https://docs.ntfy.sh/
    as_of: 2026-10-06
  - text: The free service allows 250 alerts a day. Each alert's text can be up to 4,096 bytes, plenty for a short note.
    evidence: claimed
    source_url: https://github.com/binwiederhier/ntfy/blob/main/docs/publish.md#limitations
    as_of: 2026-10-06
  - text: ntfy keeps each alert on its own computers for 12 hours by default. On Android, alerts also pass through Google's delivery service (Firebase Cloud Messaging).
    evidence: claimed
    source_url: https://docs.ntfy.sh/faq/
    as_of: 2026-10-06
  - text: ntfy does not promise the free service will always work.
    evidence: claimed
    source_url: https://docs.ntfy.sh/faq/
    as_of: 2026-10-06
distributions:
- client: any
  method: manual_steps
  steps:
  - Install the ntfy app on your phone (Google Play, App Store or F-Droid).
  - "Make up a long, random alert name. ntfy calls it a \"topic\". Treat it like a password: anyone who knows it can read your alerts. Use letters, numbers, dashes (-) and underscores (_), up to 64 characters. The \"Official guide\" link below goes to ntfy's help pages, which can make one for you."
  - In the phone app, subscribe to that alert name (the app calls it a topic). Your alerts will show up there.
  - Ask your AI to make your script send a short message to https://ntfy.sh/<your-alert-name>. The "First thing to try" message on the Caf.ai setup page does this for you.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://docs.ntfy.sh/
access:
  auth: none
  credential_needed: a long, made-up alert name (ntfy calls it a topic). It works like a password
  read_write: not_applicable
  data_touched:
  - The text of each alert you send
  access_plain: Can't see anything on your computer or in Excel. Can see only the alert text your script sends. Anyone who knows your alert name can read it too.
  effort_plain: About 5 minutes. Needs only the ntfy phone app, with no sign-up.
  least_privilege_steps:
  - Use a long, random alert name, and keep it out of any script you share with others.
  - Send only a short note, like "Something changed in your sheet, open Excel". Never send the cell values.
  - Want the alert to show the cell values? First lock your alert name so only you can read it. That needs a paid ntfy plan, or running ntfy on a computer of your own.
  - Watching a work spreadsheet? Check your employer's rules before sending anything about it to an outside service.
runtime:
  location: remote
cost:
  model: free
  plan_required: Paid plans from $5 a month (billed yearly) add more messages and reserved topics
  source_url: https://ntfy.sh/#pricing
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
  namespace_verified: false
  notes: The ntfy.sh service and its HTTP API are run by the ntfy project itself (open source, maintainer binwiederhier on GitHub; server v2.28.0 released 2026-08-27). Widely used; no broad credentials needed. Reviewed by Claude (AI) on 2026-10-06 from the maker's own pages, for the intake's saved examples; no person has reviewed it yet.
editorial:
  what_it_is: ntfy is a free alert service with a phone app. Your script sends it a short message, and your phone buzzes.
  could_help_with: Buzzing your phone with a short note, like "Something changed, open Excel", each time a cell you watch changes.
  first_prompt: Add a phone alert to my Tampermonkey script. When a cell I watch changes, send a short note to https://ntfy.sh/[paste your alert name here]. Leave the cell values out of the note. Use Tampermonkey's own way of sending (GM_xmlhttpRequest), and add the @connect line it needs. Explain each change in plain words.
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
last_verified_on: 2026-10-06
