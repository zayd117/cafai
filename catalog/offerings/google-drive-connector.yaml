# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: google-drive-connector
kind: mcp_server
identity:
  display_name: Let Claude read and save files in your Google Drive
  vendor: Google
  technical_name: Google Drive connector for Claude (remote server https://drivemcp.googleapis.com/mcp/v1)
capabilities:
- spreadsheet-files
need_signals:
- text: Keeps reports or exports in Google Sheets or Google Drive
  need_type: implied
skip_if:
- Your spreadsheets are in Excel or another app, not Google Drive.
resource_profile:
  provides:
  - text: Finds files in your Drive and opens Sheets, Slides, PDFs and Office files like Word and Excel. It can also save files there, and turn them into Google Docs, Sheets or Slides if you like.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
    as_of: 2026-10-06
  - text: It can search, read, make and change files in your Drive.
    evidence: observed
    source_url: https://claude.com/marketplace/connectors/google-drive
    as_of: 2026-10-06
  - text: In a chat, you can also switch on Claude's separate Google Docs, Sheets and Slides add-ons. Claude then makes and edits those files next to the chat while you watch. These are still in testing.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
    as_of: 2026-10-06
  requires:
  - text: A Google account. On Claude Team and Enterprise plans, the team's Claude owner must switch it on first. Then others on the team can sign in.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
    as_of: 2026-10-06
  supports:
  - text: Available to all users on Claude and Claude Desktop.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
    as_of: 2026-10-06
  - text: Anthropic's connector directory lists it as made by Google, added March 2026.
    evidence: observed
    source_url: https://claude.com/marketplace/connectors/google-drive
    as_of: 2026-10-06
  limits:
  - text: It reads only the words in a file. Pictures inside a file are skipped.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
    as_of: 2026-10-06
  - text: It asks you each time before it shares, moves or deletes a file. This is on from the start.
    evidence: claimed
    source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
    as_of: 2026-10-06
distributions:
- client: claude_desktop
  method: connector
  url: https://claude.com/marketplace/connectors/google-drive
  steps:
  - Open the "Start here" link above. It's Google Drive's page in Claude's list of add-ons. Add it, then sign in with your Google account.
  - Want to watch Claude fill in the sheet while you chat? Also switch on Google Sheets from the + menu in a chat. It is still in testing. It's separate from the Claude panel inside Google Sheets.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
access:
  auth: oauth
  credential_needed: your Google account, to sign in
  read_write: read_write
  data_touched:
  - Files in your Google Drive, including Google Sheets
  access_plain: Can see the files in your Google Drive. Can make new files and change existing ones. Asks you first before it shares, moves or deletes a file.
  access_short: Your Google Drive. Can make and change files. Asks before sharing, moving or deleting.
  effort_plain: About 5 minutes. Needs your Google account.
  effort_short: About 5 min
  first_step: Have a Google account. On Claude team plans, the owner switches it on first.
  least_privilege_steps:
  - Keep your weekly reports in one Drive folder. When you ask Claude, paste the sheet's link into the chat, so it doesn't search your whole Drive.
  - Don't switch off the check that asks you before it shares, moves or deletes a file.
runtime:
  location: remote
cost:
  model: free
  label: Free
  plan_required: Available to all Claude users
  source_url: https://support.claude.com/en/articles/10166901-use-google-workspace-connectors
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
