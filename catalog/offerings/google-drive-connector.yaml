access:
  auth: oauth
  credential_needed: Sign in with your Google account
  read_write: read_write
  data_touched:
  - Files in your Google Drive, including Google Sheets
  access_plain: Reads files in your Google Drive and can save new ones. Sharing, moving or deleting a file asks you first.
  effort_plain: About 5 minutes
  least_privilege_steps:
  - Keep the weekly report in one Drive folder and give Claude the sheet's link, so it doesn't search your whole Drive.
  - Leave the default "ask before sharing, moving or trashing" setting on.
