# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: open-food-facts-barcodes
kind: api
identity:
  display_name: Look up packaged foods by scanning their barcode
  vendor: Open Food Facts
  technical_name: Open Food Facts API (v3)
  repo_url: https://github.com/openfoodfacts/openfoodfacts-server
capabilities:
- barcode-food-lookup
need_signals:
- text: The app lets people log packaged food by scanning it instead of typing
  need_type: implied
skip_if:
- The app will not scan barcodes.
- You can't credit Open Food Facts in the app. Or you can't share changed versions of its data on the same terms.
resource_profile:
  provides:
  - text: Look up one product by its barcode number. The current version of these lookups is 3 (latest 3.6). Version 2 is being retired.
    evidence: observed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
  - text: An open list of food products, made by its community, that anyone can reuse for any purpose.
    evidence: claimed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
  requires:
  - text: Every lookup must name your app, its version and a contact email, like CalorieApp/0.1 (your email). This is called a custom User-Agent. Ask your AI to add it.
    evidence: claimed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
  - text: A barcode scanner in your app. Expo's camera can read barcodes, including the usual shop kinds (EAN-13, EAN-8, UPC-A and UPC-E).
    evidence: claimed
    source_url: https://docs.expo.dev/versions/latest/sdk/camera/
    as_of: 2026-10-06
  supports:
  - text: Reading product data needs no account or key, only the custom User-Agent.
    evidence: claimed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
  - text: A staging server (world.openfoodfacts.net, HTTP basic auth user off, password off) is provided for testing, and Open Food Facts asks that test requests go there.
    evidence: claimed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
  limits:
  - text: Up to 15 product lookups and 10 searches a minute from each internet address. Don't run a search on every letter someone types. When lookups come straight from people's phones, the limits count per person.
    evidence: claimed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
  - text: Volunteers add the data. Nobody promises it is right, complete or reliable, and you use it at your own risk.
    evidence: claimed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
  - text: The food data uses one open license (Open Database License), and the photos another (CC BY-SA). If you use them, credit Open Food Facts with a link to openfoodfacts.org. Share any changed version of the data or photos on the same terms, so others can reuse it too.
    evidence: claimed
    source_url: https://world.openfoodfacts.org/terms-of-use
    as_of: 2026-10-06
  - text: Need more than a few hundred products, or lots of lookups? Open Food Facts asks you to download its whole list instead. It strongly encourages keeping your own copy.
    evidence: claimed
    source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
    as_of: 2026-10-06
distributions:
- client: any
  method: manual_steps
  steps:
  - "Ask your AI to make your app look up each scanned barcode with: GET /api/v3.6/product/<barcode>.json"
  - Ask your AI to make the app name itself in every lookup, like CalorieApp/0.1 (you@example.com). This is called a User-Agent.
  - Ask your AI to use the practice copy at https://world.openfoodfacts.net while you make and test the app. Its shared practice login is in the official guide. When you launch, have it switch to https://world.openfoodfacts.org.
  - Show a credit line such as "Food data from Open Food Facts", with a link to openfoodfacts.org.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
access:
  auth: none
  read_write: read_only
  data_touched:
  - Public product data only
  access_plain: Can see only public food data. Can't see or change anything of yours.
  access_short: Only public food data. Nothing of yours.
  effort_plain: No sign-up needed. Then one chat with your AI to add a scan screen.
  effort_short: No sign-up needed
  first_step: Nothing to sign up for. Have a contact email ready.
  least_privilege_steps:
  - While making and testing the app, use the practice copy (the staging server). Switch to the real one (the production server) only when you launch.
  - Never put your own Open Food Facts username or password in the app. Looking up foods needs neither.
  - Let people check and fix the numbers after a scan. Volunteers type in this data, so it can be wrong.
runtime:
  location: remote
cost:
  model: free
  label: Free
  source_url: https://openfoodfacts.github.io/openfoodfacts-server/api/
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
  namespace_verified: true
  notes: Open Food Facts runs both the database and this API (openfoodfacts.org domains; server code at github.com/openfoodfacts). No package to install. There is no official Open Food Facts MCP server; community ones were not considered. Reviewed by Claude (AI) on 2026-10-06 from the maker's own pages, for the intake's saved examples; no person has reviewed it yet.
editorial:
  what_it_is: A free list of packaged foods, made by volunteers. Your app can find one by its barcode.
  could_help_with: Letting someone scan a cereal box or a yogurt and get its calories and macros, with no typing.
  first_prompt: Add a barcode scan screen to my Expo app. Look the food up on the Open Food Facts practice server (staging). Name my app in each lookup with a proper User-Agent. Show calories, protein, carbs and fat per 100 g, and let me edit the numbers before saving.
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
found_on:
  url: https://openfoodfacts.github.io/openfoodfacts-server/api/
  label: Open Food Facts’ guide
  snapshot_on: 2026-10-07
