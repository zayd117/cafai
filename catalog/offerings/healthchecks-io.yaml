# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: healthchecks-io
kind: api
identity:
  display_name: Get told when your script quietly stops
  vendor: Healthchecks
  technical_name: Healthchecks.io pinging API
  repo_url: https://github.com/healthchecks/healthchecks
capabilities:
- stopped-script-alerts
need_signals:
- text: a script, watcher or scheduled job runs unattended and could stop without anyone noticing
  need_type: latent
- text: the script depends on a page layout or sign-in that can change or expire
  need_type: latent
skip_if:
- You check the script yourself every day, and a missed change wouldn't matter.
- You already use another service that warns you when a script stops checking in.
resource_profile:
  provides:
  - text: Waits for your script to check in. It stays quiet while check-ins arrive on time, and warns you as soon as one is late. Works for scripts that run all the time.
    evidence: claimed
    source_url: https://healthchecks.io/docs/
    as_of: 2026-10-06
  - text: Check-ins can come from a script running in a web page, like your Tampermonkey script. Healthchecks is set up so the browser lets them through.
    evidence: claimed
    source_url: https://healthchecks.io/docs/javascript/
    as_of: 2026-10-06
  - text: The same link with /fail on the end warns you right away, instead of waiting for a missed check-in.
    evidence: claimed
    source_url: https://healthchecks.io/docs/http_api/
    as_of: 2026-10-06
  - text: Warnings can go to email or to other apps, including ntfy, Telegram, Microsoft Teams, Slack and Pushover.
    evidence: claimed
    source_url: https://healthchecks.io/
    as_of: 2026-10-06
  requires:
  - text: A free account. You add one check for your script, and it gets its own link. You set how often to expect a check-in (Period) and extra waiting time before a warning (Grace Time).
    evidence: claimed
    source_url: https://healthchecks.io/docs/configuring_checks/
    as_of: 2026-10-06
  supports:
  - text: The software is open source (BSD 3-clause) and can be self-hosted.
    evidence: claimed
    source_url: https://github.com/healthchecks/healthchecks
    as_of: 2026-10-06
  limits:
  - text: The free Hobbyist plan watches up to 20 scripts or other tasks. It keeps a history of 100 entries, like check-ins, for each.
    evidence: claimed
    source_url: https://healthchecks.io/pricing/
    as_of: 2026-10-06
  - text: Checking in more than 5 times a minute on one check may get blocked.
    evidence: claimed
    source_url: https://healthchecks.io/docs/http_api/
    as_of: 2026-10-06
  - text: It only knows whether your script checked in. It can't tell if the values your script read are right.
    evidence: inferred
    source_url: https://healthchecks.io/docs/
    as_of: 2026-10-06
  - text: Anything your script puts inside a check-in message is stored by Healthchecks (up to 100 kB of data each time).
    evidence: claimed
    source_url: https://healthchecks.io/docs/http_api/
    as_of: 2026-10-06
distributions:
- client: any
  method: signup
  url: https://healthchecks.io/
  steps:
  - Open the "Start here" link above. Sign up there for a free account.
  - "Add a check. That is Healthchecks' name for one script it watches. Set its Period to how often your script will check in. With these steps, that's every 5 minutes. Then set its Grace Time: the extra wait after a missed check-in before it warns you."
  - Copy your script's private check-in link. It looks like https://hc-ping.com/ followed by a long code.
  - Ask your AI to make your script check in at that link every 5 minutes, after it reads the cells fine. An empty check-in is enough. The "First thing to try" message on the Caf.ai setup page does this for you.
  - If it can't find the cells, have it use the same link with /fail on the end.
  - "Choose where warnings go: email (the default), or another app such as ntfy."
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://healthchecks.io/pricing/
- client: any
  method: manual_steps
  steps:
  - "Add a check. That is Healthchecks' name for one script it watches. Set its Period to how often your script will check in. With these steps, that's every 5 minutes. Then set its Grace Time: the extra wait after a missed check-in before it warns you."
  - Copy your script's private check-in link. It looks like https://hc-ping.com/ followed by a long code.
  - Ask your AI to make your script check in at that link every 5 minutes, after it reads the cells fine. An empty check-in is enough. The "First thing to try" message on the Caf.ai setup page does this for you.
  - If it can't find the cells, have it use the same link with /fail on the end.
  - "Choose where warnings go: email (the default), or another app such as ntfy."
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://healthchecks.io/docs/http_api/
access:
  auth: none
  credential_needed: your script's private check-in link. Anyone who has it can check in as your script
  read_write: not_applicable
  data_touched:
  - The time of each ping and anything you put in a ping's body
  access_plain: Can't see anything on your computer or in Excel. Can see only when your script checks in, plus anything your script adds to the check-in.
  access_short: Only when your script checks in, plus anything it adds. Nothing on your computer.
  effort_plain: About 10 minutes. Needs a free Healthchecks account.
  effort_short: About 10 min
  first_step: Make a free Healthchecks account. Add a check, then copy its check-in link.
  least_privilege_steps:
  - Keep each check-in empty. Then none of your spreadsheet reaches Healthchecks.
  - Keep your check-in link out of any script you share with others.
  - Don't have your script check in more than a few times a minute.
runtime:
  location: remote
cost:
  model: free
  label: Free plan
  plan_required: Hobbyist (free, 20 jobs); paid plans from $5 a month
  source_url: https://healthchecks.io/pricing/
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
  namespace_verified: false
  notes: First-party service and API; the same company publishes the open-source code (github.com/healthchecks/healthchecks, BSD 3-clause). No credentials to your other accounts are involved. Reviewed by Claude (AI) on 2026-10-06 from the maker's own pages, for the intake's saved examples; no person has reviewed it yet.
editorial:
  what_it_is: A service your script checks in with while it runs. If the check-ins stop, it emails you.
  could_help_with: Knowing that a quiet day really means no changes, not a stopped script. Plus a warning right away if your script can't find the cells.
  first_prompt: "Make my Tampermonkey script check in with my Healthchecks link: [paste your check-in link here]. Every 5 minutes, after it reads the cells fine, have it check in. Keep each check-in empty. If it can't find the cells, use the same link with /fail on the end. Use Tampermonkey's own way of sending (GM_xmlhttpRequest), and add the @connect line for hc-ping.com. Explain each change in plain words."
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
found_on:
  url: https://healthchecks.io/docs/http_api/
  label: Healthchecks’ guide
  snapshot_on: 2026-10-07
last_verified_on: 2026-10-06
