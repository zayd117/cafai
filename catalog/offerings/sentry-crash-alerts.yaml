# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: sentry-crash-alerts
kind: plugin
identity:
  display_name: Find out when your app crashes, and why
  vendor: Sentry
  technical_name: Sentry plugin for Claude Code (Sentry skills plus the hosted Sentry MCP server)
  registry_namespace: io.github.getsentry/sentry-mcp
  package_id: "@sentry/mcp-server"
  repo_url: https://github.com/getsentry/sentry-mcp
capabilities:
- error-alerts
need_signals:
- text: The app is heading to testers or real users and no crash or error tracking is mentioned
  need_type: latent
skip_if:
- You already get crash reports from another tool, such as Firebase Crashlytics or PostHog error tracking.
- The app is an early version that nobody else uses yet.
resource_profile:
  provides:
  - text: Sentry's kit for Expo apps watches for errors. It can also track speed, replay what a person did in the app, and collect your app's error messages.
    evidence: claimed
    source_url: https://docs.sentry.io/platforms/react-native/manual-setup/expo/
    as_of: 2026-10-06
  - text: The add-on links your AI to your Sentry account and adds Sentry's how-to guides. The guides set Sentry up to fit your app. They also help find and fix problems, check changes to your app's code, and turn on more features.
    evidence: claimed
    source_url: https://github.com/getsentry/plugin-claude
    as_of: 2026-10-06
  - text: The add-on links Claude Code to your Sentry account online.
    evidence: observed
    source_url: https://github.com/getsentry/plugin-claude/blob/main/.claude-plugin/plugin.json
    as_of: 2026-10-06
  - text: With the "Inspect" permission, your AI can look but not change anything. It sees your app's problems, crash details, speed records, replays, app versions and project details. It also sees any on-schedule checks (monitors). A separate permission, Seer, lets Sentry's own AI look for the cause of a problem.
    evidence: observed
    source_url: https://github.com/getsentry/sentry-mcp/blob/main/packages/mcp-core/src/skills.ts
    as_of: 2026-10-06
  requires:
  - text: Expo version 50 or newer (Expo SDK 50), and a Sentry account.
    evidence: claimed
    source_url: https://docs.sentry.io/platforms/react-native/manual-setup/expo/
    as_of: 2026-10-06
  - text: Setup uses a secret key called SENTRY_AUTH_TOKEN. Sentry says to keep it in a hidden file on your computer (.env.local). When Expo puts your app together on its own computers, keep it in Expo's hidden settings (an EAS secret). Never save it in git (your saved code history).
    evidence: claimed
    source_url: https://docs.sentry.io/platforms/react-native/manual-setup/expo/
    as_of: 2026-10-06
  supports:
  - text: The connection can be limited to one organization (/mcp/<org>) or one project (/mcp/<org>/<project>); tools then default to that scope and discovery tools are hidden.
    evidence: claimed
    source_url: https://mcp.sentry.dev/
    as_of: 2026-10-06
  - text: "At sign-in you choose permission groups: Inspect Issues & Events (read-only), Seer, Triage Issues (resolve, assign, update) and Manage Projects & Teams (create and change projects, teams, DSNs, monitors, alert rules)."
    evidence: observed
    source_url: https://github.com/getsentry/sentry-mcp/blob/main/packages/mcp-core/src/skills.ts
    as_of: 2026-10-06
  - text: Anthropic's connector directory lists Sentry, made by Sentry, for Claude web, desktop, mobile and Claude Code.
    evidence: claimed
    source_url: https://claude.com/connectors/sentry
    as_of: 2026-10-06
  limits:
  - text: The free Developer plan is for one person on your Sentry account, and covers 5,000 errors. The Team plan starts at $26/month.
    evidence: claimed
    source_url: https://sentry.io/pricing/
    as_of: 2026-10-06
  - text: Sentry says the link to your Sentry account is for fixing problems with an AI while you watch and approve. It is not meant to cover every Sentry feature.
    evidence: claimed
    source_url: https://github.com/getsentry/sentry-mcp
    as_of: 2026-10-06
distributions:
- client: claude_code
  method: plugin_marketplace
  command: claude plugin install sentry@claude-plugins-official
  steps:
  - Then type /mcp in Claude Code. It lists your add-ons and lets you sign in. Sign in to Sentry when asked.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://github.com/getsentry/plugin-claude
- client: claude_code
  method: cli_command
  command: claude mcp add --transport http sentry https://mcp.sentry.dev/mcp
  steps:
  - To let it see only one app, use https://mcp.sentry.dev/mcp/<org-slug>/<project-slug> as the address instead.
  - A Sentry sign-in page should open in your web browser. If it doesn't, type /mcp in Claude Code.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://mcp.sentry.dev/
- client: cursor
  method: deeplink
  link: cursor://anysphere.cursor-deeplink/mcp/install?name=Sentry&config=eyJ1cmwiOiJodHRwczovL21jcC5zZW50cnkuZGV2L21jcCJ9
  steps:
  - This is the same link as Sentry's own "Install in Cursor" button. It only adds Sentry's address, https://mcp.sentry.dev/mcp.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://mcp.sentry.dev/
- client: claude_desktop
  method: connector
  url: https://claude.com/connectors/sentry
  steps:
  - Open the "Start here" link above. It's Sentry's page in Claude's list of add-ons. Add it, then sign in to Sentry.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://claude.com/connectors/sentry
access:
  auth: oauth
  credential_needed: a free Sentry account. You sign in to it in your web browser. Your app's setup also uses a secret key, SENTRY_AUTH_TOKEN
  scopes:
  - inspect
  - seer
  - triage
  - project-management
  read_write: read_write
  data_touched:
  - Crash and error reports, traces and session replays from your app
  - Sentry issues (only with Triage)
  - Sentry projects, teams and alert rules (only with Manage Projects & Teams)
  access_plain: Can see your app's crash and error reports. Can mark problems fixed or change your Sentry setup only if you tick those boxes at sign-in.
  access_short: Crash reports and replays from your app. Changes things only if you allow it.
  effort_plain: About 20 minutes. Needs a free Sentry account.
  effort_short: About 20 min
  first_step: Make a free Sentry account. Setup also uses a secret key; keep it private.
  least_privilege_steps:
  - When Sentry asks what to allow, make sure only "Inspect Issues & Events" (look, don't change) is ticked. Tick more only if you want your AI to mark problems fixed or set up alerts.
  - "Want your AI to see only this app's crash reports? Ask it to use this Sentry address: https://mcp.sentry.dev/mcp/<org-slug>/<project-slug>. Fill in the short names of your Sentry organization and app, or ask your AI to."
  - Ask your AI to keep the secret key SENTRY_AUTH_TOKEN in .env.local (a hidden file on your computer). It can also go in an EAS secret (Expo's hidden settings). It must never go in git (your saved code history).
  - Start on the free Developer plan while testing. It's for one person, and covers 5,000 errors.
