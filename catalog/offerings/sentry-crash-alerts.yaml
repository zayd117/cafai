editorial:
  what_it_is: Get a report each time your app crashes. Your AI reads it and helps you fix it.
  could_help_with: Hearing about crashes on testers' phones before launch. For example, when food search fails or the log screen won't open.
  first_prompt: Add Sentry crash reports to my Expo app. Explain each step in plain words, and keep the secret key (SENTRY_AUTH_TOKEN) out of git. Then help me cause a test crash and find it in Sentry.
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
