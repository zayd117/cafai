# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: usda-fooddata-central
kind: api
identity:
  display_name: Look up calories and macros for everyday foods
  vendor: U.S. Department of Agriculture (USDA), Agricultural Research Service
  technical_name: FoodData Central API (v1)
capabilities:
- food-data-lookup
need_signals:
- text: The app tracks calories, protein, carbs or fat for foods people eat
  need_type: implied
skip_if:
- You already pay for a list of foods that covers your users' countries.
- Users will only type in their own calorie numbers by hand.
resource_profile:
  provides:
  - text: Search for foods by name and get their full nutrition details. All lookups go to USDA's address, https://api.nal.usda.gov/fdc/v1/.
    evidence: claimed
    source_url: https://fdc.nal.usda.gov/api-guide
    as_of: 2026-10-06
  - text: It has four food lists. One gives nutrients and portion sizes for foods people said they ate in a national U.S. survey. Another has foods from national and international brands, taken from their labels and updated monthly.
    evidence: claimed
    source_url: https://fdc.nal.usda.gov/data-documentation
    as_of: 2026-10-06
  - text: Each brand-name food lists its barcode number and serving size. It also has the nutrition from its label, such as calories, protein, fat and carbs.
    evidence: observed
    source_url: https://app.swaggerhub.com/apis/fdcnal/food-data_central_api/1.0.1
    as_of: 2026-10-06
  requires:
  - text: A free access key (called an API key). You get it on the FoodData Central sign-up page, and it comes from data.gov. Every lookup must include it.
    evidence: observed
    source_url: https://fdc.nal.usda.gov/api-guide
    as_of: 2026-10-06
  supports:
  - text: The data is public domain under CC0 1.0; USDA asks users to list FoodData Central as the source and, when possible, tell USDA about the product that uses it.
    evidence: claimed
    source_url: https://fdc.nal.usda.gov/api-guide
    as_of: 2026-10-06
  - text: DEMO_KEY can be used to explore the API before signing up.
    evidence: claimed
    source_url: https://fdc.nal.usda.gov/api-guide
    as_of: 2026-10-06
  limits:
  - text: By default, up to 1,000 lookups an hour from each internet address. Going over blocks your key for 1 hour.
    evidence: claimed
    source_url: https://fdc.nal.usda.gov/api-guide
    as_of: 2026-10-06
  - text: The practice key, DEMO_KEY, allows only 30 lookups an hour and 50 a day from each internet address.
    evidence: claimed
    source_url: https://fdc.nal.usda.gov/api-guide
    as_of: 2026-10-06
  - text: Keeping your key private is your job. USDA turns off keys it finds out in public, so the key should not go inside the phone app.
    evidence: claimed
    source_url: https://fdc.nal.usda.gov/api-key-signup
    as_of: 2026-10-06
  - text: USDA's guide shows no way to look a food up by its barcode, even though brand-name foods list one. So barcode scanning needs a different food list.
    evidence: inferred
    source_url: https://fdc.nal.usda.gov/api-guide
    as_of: 2026-10-06
distributions:
- client: any
  method: signup
  url: https://fdc.nal.usda.gov/api-key-signup
  steps:
  - Open the "Start here" link above. Sign up there for a free access key.
  - Ask your AI where to keep the key privately online. Save it there yourself. Then ask your AI to add food search, using https://api.nal.usda.gov/fdc/v1/foods/search. The key must stay in that private place and never reach the app.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://fdc.nal.usda.gov/api-guide
access:
  auth: api_key
  credential_needed: a free access key (called an API key) from the FoodData Central sign-up page
  read_write: read_only
  data_touched:
  - Public food and nutrient data only
  access_plain: Can see only public food data. Can't see or change anything of yours.
  effort_plain: About 5 minutes to get a free access key. Then one chat with your AI to add food search.
  least_privilege_steps:
  - Never put the key inside the phone app, or in git (your saved code history). Ask your AI where to save it privately online, then save it there yourself.
  - Try it first with the practice key, DEMO_KEY. Then switch to your own key.
  - Save the foods people pick in your app's own storage. Then foods people log again don't use up your 1,000 lookups an hour.
runtime:
  location: remote
cost:
  model: free
  source_url: https://fdc.nal.usda.gov/api-guide
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
  namespace_verified: true
  notes: Run by USDA's Agricultural Research Service and served from usda.gov domains (fdc.nal.usda.gov, api.nal.usda.gov). Not a package; nothing to install. Reviewed by Claude (AI) on 2026-10-06 from the maker's own pages, for the intake's saved examples; no person has reviewed it yet.
editorial:
  what_it_is: FoodData Central is a free list of foods and their nutrition. Your app can look up calories, protein, carbs and fat in it.
  could_help_with: Filling in the numbers when someone logs "1 banana" or "150 g chicken breast".
  first_prompt: Plan how my app can look up a food in USDA FoodData Central. Show its calories, protein, carbs and fat per serving. Keep the access key in a private place online, never inside the app. Explain the plan in plain words before you write any code.
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
last_verified_on: 2026-10-06
