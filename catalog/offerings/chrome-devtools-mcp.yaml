# REAL entry, written for the intake's saved examples (catalog/examples/). Every fact cites the maker's own page.
id: chrome-devtools-mcp
kind: mcp_server
identity:
  display_name: Let your AI see and test the Excel page your script reads
  vendor: Google's Chrome team
  technical_name: chrome-devtools-mcp
  registry_namespace: io.github.ChromeDevTools/chrome-devtools-mcp
  package_id: npm:chrome-devtools-mcp
  repo_url: https://github.com/ChromeDevTools/chrome-devtools-mcp
capabilities:
- live-page-inspection
need_signals:
- text: writes a userscript, browser extension or scraper that reads elements on a live web page
  need_type: implied
- text: needs to debug console errors from a script running in the browser
  need_type: implied
skip_if:
- You use Claude Code on a Pro, Max, Team or Enterprise plan, with the Claude in Chrome add-on. It can already read pages and error messages in your own Chrome or Edge.
- You use Excel in Microsoft Edge or another browser and won't use Google Chrome. This add-on is made only for Chrome.
- You don't want your AI to see what is open in a browser window.
resource_profile:
  provides:
  - text: Lets your AI control a real Chrome window and look inside the pages it opens.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/README.md
    as_of: 2026-10-06
  - text: Lists the parts of a page as text. Your AI can then find which parts hold the values it needs.
    evidence: observed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/tool-reference.md
    as_of: 2026-10-06
  - text: Runs small bits of code on the open page and shows the result. So your cell-reading code can be tried before it goes into your Tampermonkey script.
    evidence: observed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/tool-reference.md
    as_of: 2026-10-06
  - text: Shows the page's error messages, and where in the code they came from if asked. So your AI can read the errors your cell-reading code causes.
    evidence: observed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/tool-reference.md
    as_of: 2026-10-06
  requires:
  - text: An up-to-date, regular Google Chrome. Also Node.js, a free program this add-on runs on (pick the version marked LTS). It comes with npm, which it also uses. Not sure you have them? Ask your AI to check.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/README.md
    as_of: 2026-10-06
  supports:
  - text: Can attach to the Chrome you already have open (Chrome 144 or newer, --autoConnect after allowing it at chrome://inspect/#remote-debugging), useful when a site needs your sign-in; it then has access to all open windows of that profile.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/advanced-usage.md
    as_of: 2026-10-06
  - text: By default it starts its own Chrome with a separate, reused profile; --isolated uses a temporary profile that is wiped after the browser closes.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/advanced-usage.md
    as_of: 2026-10-06
  limits:
  - text: Made only for Google Chrome. Microsoft Edge and similar browsers may work, but Google does not promise it.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/README.md
    as_of: 2026-10-06
  - text: Your AI can see and change anything in the Chrome it controls, in every tab and window.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/README.md
    as_of: 2026-10-06
  - text: Google collects usage data by default. Add --no-usage-statistics to turn that off.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/README.md
    as_of: 2026-10-06
  - text: Some accounts may refuse to sign in inside this add-on's own Chrome window. If yours does, Google suggests connecting it to a Chrome you opened yourself.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/advanced-usage.md
    as_of: 2026-10-06
  - text: One way of connecting is called a "remote debugging port". While it is on, any app on your computer can control Chrome.
    evidence: claimed
    source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/advanced-usage.md
    as_of: 2026-10-06
distributions:
- client: claude_code
  method: cli_command
  command: claude mcp add chrome-devtools --scope user npx chrome-devtools-mcp@latest
  steps:
  - First install Node.js, a free program this add-on runs on. Pick the version marked LTS. It comes with npm, which this add-on also uses. Not sure you have them? Ask your AI to check. Also keep Google Chrome up to date.
  - Then Claude Code runs the command above. It adds the add-on for all your projects, not just this one.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/client-configurations.md
- client: claude_code
  method: plugin_marketplace
  steps:
  - Added this before by typing the claude mcp add command? Ask Claude Code to remove that copy first, so you don't end up with two.
  - "In Claude Code, type: /plugin marketplace add ChromeDevTools/chrome-devtools-mcp"
  - "Then type: /plugin install chrome-devtools-mcp@chrome-devtools-plugins"
  - Restart Claude Code. Then type /skills to check that it loaded.
  version_pin: 1.10.1
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/client-configurations.md
- client: cursor
  method: deeplink
  link: cursor://anysphere.cursor-deeplink/mcp/install?name=chrome-devtools&config=eyJjb21tYW5kIjoibnB4IC15IGNocm9tZS1kZXZ0b29scy1tY3BAbGF0ZXN0In0%3D
  steps:
  - This link adds the add-on to Cursor. You need Node.js and Google Chrome first.
  compatibility: declared
  verified_on: 2026-10-06
  source_url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/client-configurations.md
access:
  auth: none
  read_write: read_write
  data_touched:
  - Pages open in the controlled Chrome profile, including signed-in sites
  - Console messages and network requests of those pages
  access_plain: Can see and change everything in the Chrome it controls, in every tab and window. Can open pages, click, type, run small bits of code and read error messages. Can see any site you sign in to there.
  access_short: Everything in the Chrome it controls, even signed-in sites. It can change things there.
  effort_plain: About 5 minutes. Needs Chrome and Node.js (a free program it runs on).
  effort_short: About 5 min
  first_step: Install Node.js, a free program, and keep Google Chrome up to date.
  least_privilege_steps:
  - Use the separate Chrome window this add-on opens, not your everyday Chrome. Sign in there only to the Microsoft account that has your Excel file.
  - Practise on a copy of your Excel file, or a test sheet with nothing private in it.
  - To stop Google collecting usage data, add --no-usage-statistics to this add-on's start-up settings. Your AI can do this for you.
  - Only let your AI use your everyday Chrome (the --autoConnect setting) if it must watch Tampermonkey run. Close other tabs first. In this mode, your AI can reach every open window.
  - Your AI may suggest a "remote debugging port". While it's on, any app on your computer can control Chrome. Sign out of private accounts like email or banking first.
runtime:
  location: local
  requires:
  - Node.js LTS
  - Google Chrome (stable)
cost:
  model: free
  label: Free
  source_url: https://registry.npmjs.org/chrome-devtools-mcp
  as_of: 2026-10-06
trust:
  state: reviewed
  vendor_official: true
  namespace_verified: true
  notes: Published by Google's Chrome DevTools team; the npm package chrome-devtools-mcp (Apache-2.0, v1.10.1 on 2026-09-23) lists google-wombot among maintainers and is published from GitHub Actions with npm trusted publishing; the MCP registry entry io.github.ChromeDevTools/chrome-devtools-mcp is active. A look-alike fork exists (io.github.Async23/chrome-devtools-mcp, npm @async23/chrome-devtools-mcp); use the unscoped package only. Reviewed by Claude (AI) on 2026-10-06 from the maker's own pages, for the intake's saved examples; no person has reviewed it yet.
  third_party_grade:
    provider: mcp.market
    grade: B
    as_of: '2026-10-06'
editorial:
  what_it_is: Gives your AI its own Chrome window. There it opens pages, tests them and reads error messages.
  could_help_with: Finding the exact cells your script should read. Fixing it when it misses one. Testing changes before they go into Tampermonkey.
  first_prompt: "Open my test Excel file in Chrome: [paste your test file's link here]. I will sign in to Microsoft in that window if you ask. Find which parts of the page hold the cell values I can see. Then run a small test that lists the values you can read. Explain what you found in plain words."
  reviewer: Claude (AI), not yet a person
  reviewed_on: 2026-10-06
last_verified_on: 2026-10-06
